<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B6555F">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>musik kita 🎵</title>
  <meta name="description" content="playlist lagu-lagu yang nemenin cerita kita.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="musik kita 🎵">
  <meta property="og:description" content="playlist lagu-lagu yang nemenin cerita kita.">
  <meta property="og:image" content="assets/img/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="musik kita 🎵">
  <meta name="twitter:description" content="playlist lagu-lagu yang nemenin cerita kita.">
  <meta name="twitter:image" content="assets/img/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/musik.css">
</head>

<body>

  <div class="app">
    <header class="topbar">
      <a class="topbar-mark" href="index.html">little-archive</a>
      <span class="topbar-day">Musik</span>
    </header>

    <main class="home musik-page">
      <section class="page-head">
        <p class="page-kicker">lagu-lagu yang nemenin kita</p>
        <h1 class="page-title">playlist kita</h1>
      </section>

      <!-- Now playing -->
      <section class="now-playing">
        <div class="np-art" id="npArt"></div>
        <p class="np-title" id="npTitle">pilih lagu di bawah</p>
        <p class="np-artist" id="npArtist">—</p>

        <div class="np-progress">
          <span class="np-time" id="npCurrent">0:00</span>
          <div class="np-bar" id="npBar">
            <div class="np-fill" id="npFill"></div>
          </div>
          <span class="np-time" id="npDuration">0:00</span>
        </div>

        <p class="np-reason" id="npReason"></p>

        <div class="np-controls">
          <button class="np-btn" id="npPrev" aria-label="Sebelumnya">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
              <path d="M5 4v10h1.6V4H5zm2.8 5l7.2 5V4l-7.2 5z" />
            </svg>
          </button>
          <button class="np-btn np-btn--play" id="npPlay" aria-label="Putar/jeda">
            <svg id="npPlayIcon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
              <path d="M7 5v10l8-5-8-5z" />
            </svg>
          </button>
          <button class="np-btn" id="npNext" aria-label="Berikutnya">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
              <path d="M13 4v10h-1.6V4H13zM10.2 9l-7.2 5V4l7.2 5z" />
            </svg>
          </button>
        </div>
      </section>

      <!-- Track list -->
      <section class="track-list-section">
        <div class="section-label"><span class="section-line"></span><span>daftar lagu</span></div>
        <div class="track-list" id="trackList"></div>
      </section>
    </main>

    <audio id="musicAudio" preload="none"></audio>

    <nav class="tabbar" aria-label="Navigasi utama">
      <a class="tab" href="index.html" aria-label="Home">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 9.5L10 3l7 6.5M5 8v8.5a.5.5 0 00.5.5h9a.5.5 0 00.5-.5V8" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <a class="tab" href="surat.html" aria-label="Surat">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M2.5 5.5h15v9a1 1 0 01-1 1h-13a1 1 0 01-1-1v-9z" stroke="currentColor" stroke-width="1.5"
            stroke-linejoin="round" />
          <path d="M3 5.8l7 5 7-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </a>
      <a class="tab" href="galeri.html" aria-label="Galeri">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="2.5" y="3.5" width="15" height="13" rx="1.2" stroke="currentColor" stroke-width="1.5" />
          <circle cx="7" cy="8" r="1.4" stroke="currentColor" stroke-width="1.4" />
          <path d="M3.5 14.5l4-4 3 3 3.5-4 3.5 4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
      </a>
      <a class="tab is-active" href="musik.html" aria-label="Musik">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M7.5 15a2 2 0 100-4 2 2 0 000 4zM15 13a2 2 0 100-4 2 2 0 000 4z" stroke="currentColor"
            stroke-width="1.5" />
          <path d="M9.5 15V5.8L17 4.5v8.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
      </a>
      <a class="tab" href="tamu.html" aria-label="Guestbook">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M4 16.5V5a1.5 1.5 0 011.5-1.5h9A1.5 1.5 0 0116 5v11.5l-3-2-2.5 2-2.5-2-2.5 2-1.5-.5z"
            stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
      </a>
    </nav>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/effects.js"></script>
  <script src="assets/js/musik.js"></script>
</body>

</html>
