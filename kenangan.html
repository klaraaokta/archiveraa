    <header class="topbar">
      <a class="topbar-mark" href="index.html">little-archive</a>
      <span class="topbar-day">Kenangan</span>

    <main class="home kenangan-page">

      <section class="page-head">
        <p class="page-kicker">hal-hal kecil yang berarti besar</p>
        <h1 class="page-title">kenangan kita</h1>
      </section>

      <!-- Growth Tree -->
      <section class="block">
        <div class="section-label"><span class="section-line"></span><span>pohon kenangan kita</span></div>
        <div class="tree-scene">
          <div class="tree-svg-wrap" id="treeSvgWrap"></div>
          <p class="tree-caption" id="treeCaption"></p>
          <p class="tree-sub">tumbuh tiap kali sayangg mampir ke web ini</p>
        </div>
      </section>

      <!-- Our Little Things -->
      <section class="block">
        <div class="section-label"><span class="section-line"></span><span>our little things</span></div>
        <div class="things-grid" id="thingsGrid"></div>
      </section>

      <!-- Love Language Meter -->
      <section class="block">
        <div class="section-label"><span class="section-line"></span><span>cara aku nunjukkin sayang</span></div>
        <div class="llm-list" id="llmList"></div>
      </section>

      <!-- Countdown ke momen lain -->
      <section class="block">
        <div class="section-label"><span class="section-line"></span><span>momen yang ditunggu</span></div>
        <div class="moment-switcher" id="momentSwitcher"></div>
        <div class="moment-countdown" id="momentCountdown">
          <span class="mc-num" id="mcDays">00</span>
          <span class="mc-label">hari lagi</span>
        </div>
      </section>

      <!-- 19 Reasons -->
      <section class="block">
        <div class="section-label"><span class="section-line"></span><span>19 alasan sayang sayangg</span></div>
        <div class="reasons-grid" id="reasonsGrid"></div>
      </section>

      <!-- Quiz -->
      <section class="block">
        <div class="section-label"><span class="section-line"></span><span>seberapa kenal cerita kita?</span></div>
        <div class="quiz-card" id="quizCard">
          <p class="quiz-progress" id="quizProgress"></p>
          <p class="quiz-q" id="quizQ"></p>
          <div class="quiz-opts" id="quizOpts"></div>
          <p class="quiz-result" id="quizResult" hidden></p>
        </div>
      </section>

    </main>

    <!-- Hidden hearts scattered across the page -->
    <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>
