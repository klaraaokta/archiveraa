        <div class="voice-time">
          <span id="timeCurrent">0:00</span>
          <span id="timeTotal">0:00</span>
        </div>

        <p class="voice-caption">"selamat ulang tahun, Frio." — sebuah rekaman kecil, tekan play kalau kamu udah siap
