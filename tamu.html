<body>

  <div class="app">
    <header class="topbar">
      <a class="topbar-mark" href="index.html">little-archive</a>
      <span class="topbar-day">Guestbook</span>
    </header>

    <main class="home tamu-page">
      <section class="page-head">
        <p class="page-kicker">tinggalkan jejak kamu di sini</p>
        <h1 class="page-title">guestbook</h1>
      </section>

      <!-- Love counter -->
      <section class="love-counter">
        <button class="lc-heart" id="lcHeart" aria-label="Tambah cinta">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 21s-7.5-4.6-10-9.3C.5 8 2.6 4.5 6.2 4.5c2 0 3.6 1.1 4.6 2.6.9-1.5 2.6-2.6 4.6-2.6 3.6 0 5.7 3.5 4.2 7.2C19.5 16.4 12 21 12 21z" />
          </svg>
        </button>
        <p class="lc-count" id="lcCount">0</p>
        <p class="lc-label">tekan tiap kali kamu ngerasa sayang aku</p>
      </section>

      <!-- Mood button -->
      <section class="mood-block">
        <div class="section-label"><span class="section-line"></span><span>lagi mood apa hari ini?</span></div>
        <div class="mood-row" id="moodRow"></div>
        <p class="mood-reply" id="moodReply">&nbsp;</p>
      </section>

      <!-- Wish jar -->
      <section class="wish-block">
        <div class="section-label"><span class="section-line"></span><span>wish jar</span></div>
        <form class="wish-form" id="wishForm">
          <textarea id="wishInput" class="wish-input" placeholder="tulis harapan buat Frio di sini..." maxlength="180"
            rows="2"></textarea>
          <button type="submit" class="wish-submit">masukin ke toples</button>
        </form>
        <div class="wish-jar" id="wishJar"></div>
      </section>

      <!-- Guestbook messages -->
      <section class="guestbook-block">
        <div class="section-label"><span class="section-line"></span><span>pesan buat Frio</span></div>
        <form class="gb-form" id="gbForm">
          <input type="text" id="gbName" class="gb-input" placeholder="nama kamu" maxlength="30">
          <textarea id="gbMessage" class="gb-input gb-textarea" placeholder="tulis pesan ulang tahun..." maxlength="240"
            rows="3"></textarea>
          <button type="submit" class="gb-submit">kirim pesan</button>
        </form>
        <div class="gb-list" id="gbList"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Navigasi utama">
      <a class="tab" href="index.html" aria-label="Home">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 9.5L10 3l7 6.5M5 8v8.5a.5.5 0 00.5.5h9a.5.5 0 00.5-.5V8" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <a class="tab" href="surat.html" aria-label="Surat">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M2.5 5.5h15v9a1 1 0 01-1 1h-13a1 1 0 01-1-1v-9z" stroke="currentColor" stroke-width="1.5"
            stroke-linejoin="round" />
          <path d="M3 5.8l7 5 7-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </a>
      <a class="tab" href="galeri.html" aria-label="Galeri">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="2.5" y="3.5" width="15" height="13" rx="1.2" stroke="currentColor" stroke-width="1.5" />
          <circle cx="7" cy="8" r="1.4" stroke="currentColor" stroke-width="1.4" />
          <path d="M3.5 14.5l4-4 3 3 3.5-4 3.5 4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
      </a>
      <a class="tab" href="musik.html" aria-label="Musik">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M7.5 15a2 2 0 100-4 2 2 0 000 4zM15 13a2 2 0 100-4 2 2 0 000 4z" stroke="currentColor"
            stroke-width="1.5" />
          <path d="M9.5 15V5.8L17 4.5v8.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
      </a>
      <a class="tab is-active" href="tamu.html" aria-label="Guestbook">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M4 16.5V5a1.5 1.5 0 011.5-1.5h9A1.5 1.5 0 0116 5v11.5l-3-2-2.5 2-2.5-2-2.5 2-1.5-.5z"
            stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
      </a>
    </nav>
  </div>

</body>
